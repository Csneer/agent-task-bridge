name: CI and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            clients/typescript/package-lock.json
            examples/read-consumer/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked validation dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-contract.txt
          npm ci --prefix clients/typescript
          npm ci --prefix examples/read-consumer
      - name: Build SDK before Go tests that use the real Node client
        run: npm --prefix clients/typescript run build
      - name: Frozen protocol, Go race/vet/build, TS, consumer, HTTP integration and minimal example
        run: bash tools/verify-runtime.sh runtime/validation/ci
      - name: Independent SDK package consumer
        run: npm --prefix clients/typescript run test:package
      - name: Build Linux releases and npm tarball
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="v$(node -p 'require("./clients/typescript/package.json").version')"
          if [[ "$REF_TYPE" == tag ]]; then version="$REF_NAME"; fi
          bash tools/build-release.sh "$version" dist/release
          bash tools/smoke-release.sh dist/release "$version"
      - name: Retain release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-evidence
          path: runtime/validation/ci/
          if-no-files-found: warn
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download this run's verified release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --repo "$GH_REPO" --name release-artifacts --dir release
      - name: Publish verified tag (all 0.x versions are prereleases)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="$PWD/docs/releases/$RELEASE_TAG.md"
          test -f "$notes"
          cd release
          sha256sum --check SHA256SUMS
          flags=()
          if [[ "$RELEASE_TAG" == v0.* || "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" ./* --repo "$GH_REPO" --verify-tag \
            --title "Agent↔Task Bridge $RELEASE_TAG" --notes-file "$notes" "${flags[@]}"
